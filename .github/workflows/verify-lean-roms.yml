name: Verify Lean ROMs

# Supersede an in-flight run when a newer commit arrives on the same ref
# (federation CI convention, inter/github-best-practices §4.2.1 / inter#35, #80).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runs lean2rom -verify on every push and PR to ensure roms/ are in sync
# with lean/QBP/Sedenion.lean. A checksum mismatch is a hard fail.
#
# Issue: https://github.com/JamesPagetButler/qbp-compute-unit/issues/7
# Per: peer-review-005-stream-migration.md §4 M0.1 / M0.3 CI gate

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "lean/**"
      - "roms/**"
      - "cmd/lean2rom/**"
      - "emulator/**"
      - "Makefile"
  pull_request:
    branches: ["main"]
    paths:
      - "lean/**"
      - "roms/**"
      - "cmd/lean2rom/**"
      - "emulator/**"
      - "Makefile"

jobs:
  verify-lean-roms:
    name: Verify ROM checksums match Lean source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # qbp-compute-unit#82 AC-c: install the pinned Lean toolchain so this
      # workflow genuinely builds/checks lean/ instead of lean2rom silently
      # falling back to its Go-native extraction whenever `lean` isn't on
      # PATH (the "proven ≠ wired" gap). Toolchain version comes from
      # lean/lean-toolchain — elan resolves it automatically.
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean proofs (fails on compile error or any sorry)
        run: make lean-build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: emulator/go.sum

      - name: Build lean2rom
        run: go build ./cmd/lean2rom

      - name: Verify ROM checksums
        run: make verify-roms-ci

      - name: Run emulator tests (includes TestSIMDConstantsMatchROM)
        run: make test

      - name: Run go vet
        run: make vet

      - name: Verify benchmark allocations
        run: |
          cd emulator
          go test -bench=. -benchmem ./... | tee /tmp/bench.txt
          # Hot-path 0-alloc regression guard. EXEMPT: the QMulHighPrec benchmarks
          # (W256/W512/W1024) exercise the big.Float software fallback, which
          # allocates inherently (~36 allocs/op) and is tracked as a first-class
          # metric in the baseline record (doc/benchmarks/) — it is not a hot path.
          # Every OTHER benchmark must stay 0-alloc.
          if grep -E '[0-9]+ allocs/op' /tmp/bench.txt | grep -v ' 0 allocs/op' | grep -v 'QMulHighPrec'; then
            echo "FAIL: benchmark regression — non-zero allocations detected (non-exempt benchmark)"
            exit 1
          fi
