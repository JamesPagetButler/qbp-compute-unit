# GCG Fano Proof-Tie — the prove-before-bake gate (issue #59).
#
# Closes Gap B (live-test seq=516): ties the octonion ROMs (roms/octonion_*.hex)
# AND the emulator fanoLUT to the KERNEL-PROVEN QBP Foundations table
# `FanoOrientationF3.fanoTableF4` (forced by the Cayley–Dickson product via
# `fanoTableF4_eq_cayleyDickson`, kernel `decide`), instead of only to the
# data-not-proof `lean/QBP/Sedenion.lean`.
#
# Producer side (QBP, @qbp-oppenheimer): landed via QBP #604 —
#   proofs/QBP/Foundations/fanoTableF4.snapshot     — 64 lines "i j sign index",
#     generated from the Lean `def` + QBP-CI drift-guarded (regenerate + diff).
#   proofs/QBP/Foundations/fanoTableF4.axioms.txt    — verbatim
#     `#print axioms fanoTableF4_eq_cayleyDickson`, closure ⊆
#     {propext, Classical.choice, Quot.sound} (confluent-trust#96 identity key).
#
# Consumer side (this repo): parse the snapshot, assert the ROMs + emulator
# fanoLUT match it. Cross-repo pattern mirrors wyrd-compatibility.yml — both
# repos are public, so no token is required.
#
# ─── INFRA-VS-DRIFT RUN PATTERN (issue #66; reusable across cross-repo gates) ───
# A *required* cross-repo gate MUST distinguish two failure modes, or a producer-
# side hiccup wedges this repo's entire merge queue:
#   • REAL DRIFT  → HARD-FAIL. The source was fetched, but the wired artifact is
#     absent / mismatched / carries a disallowed axiom. This is what the gate
#     exists to catch; there is NO raisable soft-escape from it.
#   • INFRA FAIL  → SOFT-PASS. We could not even fetch the source (the QBP
#     checkout failed: network / rate-limit / repo unavailable / transient). Drift
#     is then INCONCLUSIVE — soft-pass with a loud summary; the next PR + the
#     nightly cron re-check. A required gate must not brick unrelated qbp-cu merges
#     because GitHub hiccuped fetching QBP.
# Mechanism: the QBP checkout runs `continue-on-error`; on failure the drift steps
# are skipped (guarded on `steps.checkout_qbp.outcome == 'success'`) and the job
# ends green. Only a *successful* fetch proceeds to the hard-fail drift assertions.
# This is the shape @cth-implementor's CTH anchoring trigger-gate + @wyrd-implementor's
# ℍ-rung gates consume — the three-clause cross-repo-drift-gate invariant (seq=919):
# (a) candidate set = declared manifest, not `grep` [#65: the specific fanoTableF4
# artifact + whitelisted axiom lists]; (b) hard-fail on real drift, no raisable
# escape; (c) infra-soft-pass on cross-repo fetch failure — this file adds (c).

name: GCG Fano Proof-Tie

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "roms/**"
      - "emulator/**"
      - ".github/workflows/gcg-fano-proof-tie.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "roms/**"
      - "emulator/**"
      - ".github/workflows/gcg-fano-proof-tie.yml"
  # Nightly: the QBP-side snapshot can change independently of this repo, so
  # catch upstream proof/table drift even with no local change.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fano-proof-tie:
    name: ROMs + emulator fanoLUT ↔ kernel-proven fanoTableF4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout qbp-compute-unit (this repo)
        uses: actions/checkout@v4
        with:
          path: qbp-compute-unit

      # INFRA boundary (issue #66): this cross-repo fetch is the ONLY step allowed
      # to soft-pass. `continue-on-error` lets a network / rate-limit / unavailable
      # failure be *detected* (outcome == failure) instead of hard-failing the job,
      # so a QBP-side hiccup can't wedge the qbp-cu merge queue.
      - name: Checkout QBP (public; kernel-proven fanoTableF4 source)
        id: checkout_qbp
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: JamesPagetButler/QBP
          path: QBP

      - name: Infra soft-pass if the QBP checkout failed (INCONCLUSIVE, not drift)
        if: steps.checkout_qbp.outcome == 'failure'
        run: |
          echo "⚠️ **INFRA-SOFT-PASS** — could not check out \`JamesPagetButler/QBP\` (network / rate-limit / repo unavailable / transient). The proof source was NOT fetched, so ROM↔proof drift is **INCONCLUSIVE** — soft-passing rather than wedging the qbp-cu merge queue on a QBP-side infra hiccup. **This is NOT a drift pass**: the next PR + the nightly cron re-check against live QBP master. (issue #66 infra-vs-drift policy.)" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::QBP checkout failed (infra, not drift) — gate INCONCLUSIVE, soft-pass; re-checked on next PR + nightly."

      - name: Set up Go (pinned by the emulator module)
        if: steps.checkout_qbp.outcome == 'success'
        uses: actions/setup-go@v5
        with:
          go-version-file: qbp-compute-unit/emulator/go.mod

      - name: Locate snapshot (hard-fail if absent — regression, source WAS fetched)
        id: snap
        if: steps.checkout_qbp.outcome == 'success'
        run: |
          SNAP="$GITHUB_WORKSPACE/QBP/proofs/QBP/Foundations/fanoTableF4.snapshot"
          if [ ! -f "$SNAP" ]; then
            # The export landed via QBP #604. This step runs only on a SUCCESSFUL
            # QBP fetch, so an ABSENT snapshot now means the producer artifact was
            # REMOVED / regressed from master after landing — a real break in the
            # proof-tie, NOT an infra hiccup (that is handled above). HARD-FAIL.
            echo "🟥 **DRIFT / REGRESSION** — fanoTableF4.snapshot missing from a successfully-fetched QBP master. The proof source was removed after it landed (#604). This breaks the prove-before-bake tie — hard-fail." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::fanoTableF4.snapshot absent from a fetched QBP master — producer artifact regressed (was landed in #604). Real drift/regression, not infra."
            exit 1
          fi
          echo "path=$SNAP" >> "$GITHUB_OUTPUT"

      - name: Verify axiom attestation ⊆ {propext, Classical.choice, Quot.sound}
        if: steps.checkout_qbp.outcome == 'success'
        run: |
          AX="$GITHUB_WORKSPACE/QBP/proofs/QBP/Foundations/fanoTableF4.axioms.txt"
          if [ ! -f "$AX" ]; then
            echo "::error::fanoTableF4.axioms.txt not found — axiom attestation missing (issue #59, confluent-trust#96 Lean-identity key)."
            exit 1
          fi
          if ! grep -q "fanoTableF4_eq_cayleyDickson" "$AX"; then
            echo "::error::attestation does not reference fanoTableF4_eq_cayleyDickson — wrong or empty attestation."
            exit 1
          fi
          # Whitelist the ACTUAL axiom lists, not the whole file: every axiom in
          # each `depends on axioms: [...]` bracket must be in the kernel-safe set
          # {propext, Classical.choice, Quot.sound}; anything else (sorry,
          # native_decide, ofReduce*, …) ⇒ the proof is not kernel-checked.
          # NB: comment lines (`#`) are stripped first — a prose comment such as
          # "no sorry, no native_decide" must NOT false-positive the gate.
          BAD=$(grep -v '^[[:space:]]*#' "$AX" \
                  | grep -oE '\[[^]]*\]' \
                  | tr -d '[]' | tr ',' '\n' \
                  | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
                  | grep -v '^$' \
                  | grep -vxE 'propext|Classical\.choice|Quot\.sound' || true)
          if [ -n "$BAD" ]; then
            echo "::error::disallowed axiom(s) in the attestation — fanoTableF4_eq_cayleyDickson is not kernel-checked:"
            echo "$BAD"
            exit 1
          fi
          echo "axiom attestation OK (every listed axiom ⊆ {propext, Classical.choice, Quot.sound}; references fanoTableF4_eq_cayleyDickson)."
          echo "----- fanoTableF4.axioms.txt -----"
          cat "$AX"

      - name: Run prove-before-bake drift gate
        if: steps.checkout_qbp.outcome == 'success'
        env:
          FANO_SNAPSHOT: ${{ steps.snap.outputs.path }}
        run: |
          cd qbp-compute-unit/emulator
          go test ./... -run 'TestFanoProofTie|TestFanoSnapshotParser' -count=1 -v
