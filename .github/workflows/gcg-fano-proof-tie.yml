# GCG Fano Proof-Tie — the prove-before-bake gate (issue #59).
#
# Closes Gap B (live-test seq=516): ties the octonion ROMs (roms/octonion_*.hex)
# AND the emulator fanoLUT to the KERNEL-PROVEN QBP Foundations table
# `FanoOrientationF3.fanoTableF4` (forced by the Cayley–Dickson product via
# `fanoTableF4_eq_cayleyDickson`, kernel `decide`), instead of only to the
# data-not-proof `lean/QBP/Sedenion.lean`.
#
# Producer side (QBP, @qbp-oppenheimer): landed via QBP #604 —
#   proofs/QBP/Foundations/fanoTableF4.snapshot     — 64 lines "i j sign index",
#     generated from the Lean `def` + QBP-CI drift-guarded (regenerate + diff).
#   proofs/QBP/Foundations/fanoTableF4.axioms.txt    — verbatim
#     `#print axioms fanoTableF4_eq_cayleyDickson`, closure ⊆
#     {propext, Classical.choice, Quot.sound} (confluent-trust#96 identity key).
#
# Consumer side (this repo): parse the snapshot, assert the ROMs + emulator
# fanoLUT match it. Cross-repo pattern mirrors wyrd-compatibility.yml — both
# repos are public, so no token is required.
#
# ─── INFRA-VS-DRIFT RUN PATTERN (issue #66; reusable across cross-repo gates) ───
# A *required* cross-repo gate MUST distinguish two failure modes, or a producer-
# side hiccup wedges this repo's entire merge queue:
#   • REAL DRIFT  → HARD-FAIL. The source was fetched, but the wired artifact is
#     absent / mismatched / carries a disallowed axiom. This is what the gate
#     exists to catch; there is NO raisable soft-escape from it.
#   • INFRA FAIL (transient) → SOFT-PASS. We could not even fetch the source (the
#     QBP checkout failed: network / rate-limit / repo unavailable / transient).
#     Drift is then INCONCLUSIVE — soft-pass with a loud summary; the next PR + the
#     nightly cron re-check. A required gate must not brick unrelated qbp-cu merges
#     because GitHub hiccuped fetching QBP.
#   • INFRA FAIL (PERSISTENT) → ESCALATE to HARD-FAIL (issue #68). A soft-pass that
#     never ends silently self-disables a *required* gate (green while checking
#     nothing). So >= THRESHOLD consecutive infra-soft-passes hard-fails, forcing a
#     sustained QBP outage (rename / perms-revoked / down) to surface. transient ⊂
#     soft-pass, persistent ⊂ hard-fail — the same transient-vs-persistent split as
#     pending-vs-drift.
# Mechanism: the QBP checkout runs `continue-on-error`; on failure the drift steps
# are skipped (guarded on `steps.checkout_qbp.outcome == 'success'`) and the job
# ends green. Only a *successful* fetch proceeds to the hard-fail drift assertions.
# This is the shape @cth-implementor's CTH anchoring trigger-gate + @wyrd-implementor's
# ℍ-rung gates consume — the three-clause cross-repo-drift-gate invariant (seq=919):
# (a) candidate set = declared manifest, not `grep` [#65: the specific fanoTableF4
# artifact + whitelisted axiom lists]; (b) hard-fail on real drift, no raisable
# escape; (c) infra-soft-pass on cross-repo fetch failure, transient→soft /
# persistent→escalate (#66 added transient-(c); #68 adds the persistent sub-rule).
#
# ─── ALWAYS-REPORT DESIGN (issue #66 — required-check readiness) ───────────────
# For this to be a *required* status check, it must REPORT on every PR to main. A
# paths-filtered `pull_request` trigger does NOT run on PRs that miss the paths, so
# GitHub leaves the required context "Expected — waiting for status" forever and
# wedges every unrelated PR. Fix: drop the pull_request paths filter (run on every
# PR) and gate the *work* internally — the `detect` step decides relevance (touches
# roms/ | emulator/ | this workflow), and an irrelevant PR early-passes green
# without the cross-repo check. This is ONE job / ONE context on purpose: a second
# same-named "always-green companion" job is deliberately avoided, because GitHub
# keys required checks by context name and could adopt the duplicate's green result,
# MASKING a real drift failure. detect fails CLOSED (relevant=true) if it can't list
# PR files, so a query gap never skips the gate.

name: GCG Fano Proof-Tie

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "roms/**"
      - "emulator/**"
      - ".github/workflows/gcg-fano-proof-tie.yml"
  pull_request:
    # NO paths filter here — issue #66 always-report design. A *required* check that
    # is paths-filtered does NOT run on PRs that miss the paths, and GitHub then
    # leaves the required context "Expected — waiting for status" forever, wedging
    # every unrelated PR. So the job runs on EVERY PR to main and always reports the
    # required context; an internal change-gate (see the `detect` step) skips the
    # heavy cross-repo work and early-passes when roms/emulator/this-workflow are
    # untouched. One job, one context name — deliberately NOT a second same-named
    # companion job, which would risk masking a real drift failure (GitHub may adopt
    # the always-green duplicate's result for a shared context).
    branches: ["main"]
  # Nightly: the QBP-side snapshot can change independently of this repo, so
  # catch upstream proof/table drift even with no local change.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read          # issue #68: the persistent-infra escalation reads this workflow's own recent run history
  pull-requests: read    # issue #66 always-report: the `detect` step lists PR changed files to decide relevance

jobs:
  fano-proof-tie:
    name: ROMs + emulator fanoLUT ↔ kernel-proven fanoTableF4
    runs-on: ubuntu-latest

    steps:
      # ── issue #66 always-report change-gate ──────────────────────────────────
      # The job runs on every PR (no trigger paths filter) so the required context
      # always reports. This step decides whether the PR actually needs the heavy
      # cross-repo drift check: relevant iff it touches roms/, emulator/, or this
      # workflow. push / schedule / workflow_dispatch are always relevant (they have
      # no PR diff and are the upstream-drift catchers). When NOT relevant, the real
      # steps below are skipped and the job early-passes green — reporting the
      # required context without wedging unrelated PRs and without running the check.
      - name: Detect relevant changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event_name }} → always relevant (no PR diff; upstream-drift catcher)."
            exit 0
          fi
          # List the PR's changed files; fail CLOSED (relevant=true ⇒ run the real
          # check) if the listing is unavailable, so a query gap can never skip the gate.
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
                    --paginate --jq '.[].filename' 2>/dev/null) || files="__QUERY_FAILED__"
          if [ "$files" = "__QUERY_FAILED__" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::warning::could not list PR files — failing closed (running the real drift check)."
            exit 0
          fi
          if echo "$files" | grep -qE '^(roms/|emulator/|\.github/workflows/gcg-fano-proof-tie\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "PR touches roms/ | emulator/ | this workflow → running the real drift check."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "PR touches none of roms/ | emulator/ | this workflow → early-pass (no ROM↔proof drift possible from this diff)."
          fi

      - name: Not-relevant — always-report pass (issue #66)
        if: steps.detect.outputs.relevant != 'true'
        run: |
          echo "✅ **ALWAYS-REPORT PASS** — this PR changes no ROM / emulator / gate-workflow file, so it cannot introduce ROM↔proof drift. The required \`ROMs + emulator fanoLUT ↔ kernel-proven fanoTableF4\` context reports green without running the cross-repo check. (issue #66 always-report design — a required gate must report on every PR, but only *work* when the diff can affect it.)" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout qbp-compute-unit (this repo)
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/checkout@v4
        with:
          path: qbp-compute-unit

      # INFRA boundary (issue #66): this cross-repo fetch is the ONLY step allowed
      # to soft-pass. `continue-on-error` lets a network / rate-limit / unavailable
      # failure be *detected* (outcome == failure) instead of hard-failing the job,
      # so a QBP-side hiccup can't wedge the qbp-cu merge queue.
      - name: Checkout QBP (public; kernel-proven fanoTableF4 source)
        id: checkout_qbp
        if: steps.detect.outputs.relevant == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: JamesPagetButler/QBP
          path: QBP

      - name: Infra soft-pass if the QBP checkout failed (INCONCLUSIVE, not drift)
        if: steps.checkout_qbp.outcome == 'failure'
        run: |
          echo "⚠️ **INFRA-SOFT-PASS** — could not check out \`JamesPagetButler/QBP\` (network / rate-limit / repo unavailable / transient). The proof source was NOT fetched, so ROM↔proof drift is **INCONCLUSIVE** — soft-passing rather than wedging the qbp-cu merge queue on a QBP-side infra hiccup. **This is NOT a drift pass**: the next PR + the nightly cron re-check against live QBP master. (issue #66 infra-vs-drift policy.)" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::QBP checkout failed (infra, not drift) — gate INCONCLUSIVE, soft-pass; re-checked on next PR + nightly."

      # issue #68: a TRANSIENT fetch failure soft-passes (above); a PERSISTENT one
      # must NOT soft-pass forever, or the required gate silently self-disables
      # (green while checking nothing). Count consecutive prior infra-soft-passes
      # of this workflow on this branch — a run was an infra-soft-pass iff its
      # "Infra soft-pass…" step ran (conclusion==success); a real-green or
      # hard-fail breaks the streak. At >= THRESHOLD consecutive, ESCALATE to a
      # hard fail so a sustained QBP outage surfaces instead of bypassing.
      - name: Escalate a PERSISTENT infra-soft-pass (issue #68)
        if: steps.checkout_qbp.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD: "3"   # consecutive infra-soft-passes (nightly ⇒ ~3 days QBP-unreachable) → hard fail
        run: |
          set -o pipefail
          consecutive=1   # this run is the 1st consecutive infra-soft-pass
          # Query window MUST exceed THRESHOLD, else the streak can never reach it
          # (per @wyrd-implementor #69 §I4). Derive it from THRESHOLD + margin so a
          # future THRESHOLD bump can't silently cap escalation below the threshold.
          LIMIT=$(( THRESHOLD + 9 ))
          # Recent COMPLETED runs of this workflow on this branch, newest first, excluding the current run.
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow gcg-fano-proof-tie.yml \
                  --branch "$GITHUB_REF_NAME" --status completed --limit "$LIMIT" \
                  --json databaseId --jq '.[].databaseId' 2>/dev/null | grep -vx "$GITHUB_RUN_ID" || true)
          for id in $ids; do
            # A prior run was an infra-soft-pass iff its "Infra soft-pass…" step ran (conclusion success, not skipped).
            softpass=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                        --jq 'any(.jobs[].steps[]?; (.name|startswith("Infra soft-pass")) and .conclusion=="success")' 2>/dev/null || echo "unknown")
            if [ "$softpass" = "true" ]; then
              consecutive=$((consecutive + 1))
            else
              # real-green, hard-fail, or unreadable → streak broken (fail-safe: don't over-escalate on a query gap)
              break
            fi
          done
          echo "Consecutive infra-soft-passes incl. this run: $consecutive (threshold $THRESHOLD)."
          if [ "$consecutive" -ge "$THRESHOLD" ]; then
            echo "🟥 **PERSISTENT-INFRA ESCALATION (#68)** — $consecutive consecutive QBP-fetch failures. The prove-before-bake gate has been unable to verify ROM↔proof drift for $consecutive runs: this is no longer a transient hiccup and is now a **HARD FAIL**. Investigate QBP availability / repo rename / permissions revocation. (A required gate must not silently self-disable on a sustained outage.)" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::PERSISTENT infra failure — $consecutive consecutive infra-soft-passes (>= $THRESHOLD). Escalating to hard fail so a sustained QBP-fetch failure surfaces instead of silently bypassing the gate (#68)."
            exit 1
          fi
          echo "::warning::infra-soft-pass $consecutive/$THRESHOLD consecutive — within transient tolerance, soft-passing (#68)."

      - name: Set up Go (pinned by the emulator module)
        if: steps.checkout_qbp.outcome == 'success'
        uses: actions/setup-go@v5
        with:
          go-version-file: qbp-compute-unit/emulator/go.mod

      - name: Locate snapshot (hard-fail if absent — regression, source WAS fetched)
        id: snap
        if: steps.checkout_qbp.outcome == 'success'
        run: |
          SNAP="$GITHUB_WORKSPACE/QBP/proofs/QBP/Foundations/fanoTableF4.snapshot"
          if [ ! -f "$SNAP" ]; then
            # The export landed via QBP #604. This step runs only on a SUCCESSFUL
            # QBP fetch, so an ABSENT snapshot now means the producer artifact was
            # REMOVED / regressed from master after landing — a real break in the
            # proof-tie, NOT an infra hiccup (that is handled above). HARD-FAIL.
            echo "🟥 **DRIFT / REGRESSION** — fanoTableF4.snapshot missing from a successfully-fetched QBP master. The proof source was removed after it landed (#604). This breaks the prove-before-bake tie — hard-fail." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::fanoTableF4.snapshot absent from a fetched QBP master — producer artifact regressed (was landed in #604). Real drift/regression, not infra."
            exit 1
          fi
          echo "path=$SNAP" >> "$GITHUB_OUTPUT"

      - name: Verify axiom attestation ⊆ {propext, Classical.choice, Quot.sound}
        if: steps.checkout_qbp.outcome == 'success'
        run: |
          AX="$GITHUB_WORKSPACE/QBP/proofs/QBP/Foundations/fanoTableF4.axioms.txt"
          if [ ! -f "$AX" ]; then
            echo "::error::fanoTableF4.axioms.txt not found — axiom attestation missing (issue #59, confluent-trust#96 Lean-identity key)."
            exit 1
          fi
          if ! grep -q "fanoTableF4_eq_cayleyDickson" "$AX"; then
            echo "::error::attestation does not reference fanoTableF4_eq_cayleyDickson — wrong or empty attestation."
            exit 1
          fi
          # Whitelist the ACTUAL axiom lists, not the whole file: every axiom in
          # each `depends on axioms: [...]` bracket must be in the kernel-safe set
          # {propext, Classical.choice, Quot.sound}; anything else (sorry,
          # native_decide, ofReduce*, …) ⇒ the proof is not kernel-checked.
          # NB: comment lines (`#`) are stripped first — a prose comment such as
          # "no sorry, no native_decide" must NOT false-positive the gate.
          BAD=$(grep -v '^[[:space:]]*#' "$AX" \
                  | grep -oE '\[[^]]*\]' \
                  | tr -d '[]' | tr ',' '\n' \
                  | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
                  | grep -v '^$' \
                  | grep -vxE 'propext|Classical\.choice|Quot\.sound' || true)
          if [ -n "$BAD" ]; then
            echo "::error::disallowed axiom(s) in the attestation — fanoTableF4_eq_cayleyDickson is not kernel-checked:"
            echo "$BAD"
            exit 1
          fi
          echo "axiom attestation OK (every listed axiom ⊆ {propext, Classical.choice, Quot.sound}; references fanoTableF4_eq_cayleyDickson)."
          echo "----- fanoTableF4.axioms.txt -----"
          cat "$AX"

      - name: Run prove-before-bake drift gate
        if: steps.checkout_qbp.outcome == 'success'
        env:
          FANO_SNAPSHOT: ${{ steps.snap.outputs.path }}
        run: |
          cd qbp-compute-unit/emulator
          go test ./... -run 'TestFanoProofTie|TestFanoSnapshotParser' -count=1 -v
