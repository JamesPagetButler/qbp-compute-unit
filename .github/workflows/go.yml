name: Go CTH CI

# Supersede an in-flight run when a newer commit arrives on the same ref
# (federation CI convention, inter/github-best-practices §4.2.1 / inter#35, #80).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    paths:
      - 'cth/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'cth/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Build
      run: cd cth && go build -v ./...

    - name: Test
      run: cd cth && go test -v ./...
